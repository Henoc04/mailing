# Reverse proxy de référence pour la production (Nginx sur l'hôte, devant
# les conteneurs Docker). À adapter (nom de domaine, chemins des certificats)
# puis à placer dans /etc/nginx/sites-available/, activer, et recharger :
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routes indispensables vers le backend (port 4000) :
#   /api/       API, images des modèles, page de désinscription
#   /t/         pixel de suivi des ouvertures (/t/o/...) et des clics (/t/c/...)
#   /socket.io/ progression des campagnes en temps réel (WebSocket)
# Tout le reste va au frontend (port 5173).

server {
    listen 80;
    server_name crm.savplusformation.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.savplusformation.fr;

    ssl_certificate     /etc/letsencrypt/live/crm.savplusformation.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.savplusformation.fr/privkey.pem;

    # Pièces jointes et imports jusqu'à 15 Mo (limite de l'application).
    client_max_body_size 16m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
    }

    location /t/ {
        proxy_pass http://127.0.0.1:4000;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
    }
}
